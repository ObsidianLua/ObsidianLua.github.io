<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ObsidianLua Scripts</title><style>
:root{--ink:#f4f1e9;--paper:#101512;--muted:#a5aca2;--lime:#d6ff45;--line:#314036}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 86% 4%,#243b20 0,transparent 30rem),var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{max-width:1150px;margin:auto;padding:96px 28px 80px}.eyebrow{color:var(--lime);font:700 11px monospace;letter-spacing:.14em}h1{font-size:clamp(54px,9vw,114px);letter-spacing:-.08em;line-height:.85;margin:14px 0}.intro{color:var(--muted);font-size:18px;line-height:1.55;max-width:590px;margin:34px 0 25px}.repo{display:inline-block;background:var(--lime);color:#101512;font-weight:700;padding:13px 17px;text-decoration:none}.library{border-top:1px solid var(--line);margin-top:78px;padding-top:34px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}h2{margin:8px 0;font-size:27px}.search{background:transparent;border:1px solid var(--line);color:var(--ink);font-size:15px;padding:13px;width:min(330px,100%)}.grid{display:grid;gap:10px}.card{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;background:#151d18;border:1px solid var(--line);padding:16px}.icon{border:1px solid var(--lime);color:var(--lime);font:700 11px monospace;padding:10px 4px;text-align:center}h3{font-size:16px;margin:0 0 7px}code{display:block;max-width:580px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font:11px monospace}.actions{display:flex;gap:9px}.actions a,.actions button{border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-weight:700;font-size:12px;padding:10px 12px;text-decoration:none;white-space:nowrap}.actions button{border-color:var(--lime);color:var(--lime)}@media(max-width:680px){main{padding:64px 18px}.head{align-items:stretch;flex-direction:column}.search{width:100%}.card{grid-template-columns:42px 1fr}.actions{grid-column:1/-1}code{max-width:240px}}
</style></head><body><main><p class="eyebrow">OBSIDIANLUA / SCRIPT LIBRARY</p><h1>ObsidianLua Scripts</h1><p class="intro">Grab a direct raw URL for any published Luau script. Every link points to the public GitHub mirror.</p><a class="repo" href="https://github.com/ObsidianLua/fisher-scripts">Open GitHub repository ↗</a><section class="library"><div class="head"><div><p class="eyebrow">RAW URL DIRECTORY</p><h2 id="count"></h2></div><input class="search" id="search" placeholder="Search scripts…"></div><div class="grid" id="grid"></div></section></main><script>
const base='https://raw.githubusercontent.com/ObsidianLua/fisher-scripts/main/';const files=['Fisher - Sync V2 - R6.lua','Fisher - Sync V2 - R15.lua','Fisher - Duo Sync - R6.lua','Fisher - Duo Sync - R15.lua','Fisher - Low Sync - R6.lua','Fisher - Low Sync - R15.lua','Fisher - Close Sync - R6.lua','Fisher - Close Sync - R15.lua','Fisher - Solo Loop - R6.lua','Fisher - Solo Loop - R15.lua','Fisher Hub.lua','Fisher MM2 Tools.lua',"Fisher's Yeet GUI.lua",'Give Them Head.lua','Break Your Bones Script.lua','Infinite Yield.lua','Vertex Hub.lua'];const url=f=>base+encodeURIComponent(f);function render(){const q=search.value.toLowerCase(),items=files.filter(f=>f.toLowerCase().includes(q));count.textContent=items.length+' scripts';grid.innerHTML=items.map(f=>`<article class="card"><div class="icon">LUA</div><div><h3>${f.slice(0,-4)}</h3><code>${url(f)}</code></div><div class="actions"><a target="_blank" href="${url(f)}">Open raw</a><button onclick="navigator.clipboard.writeText('${url(f)}');this.textContent='Copied!';setTimeout(()=>this.textContent='Copy URL',1200)">Copy URL</button></div></article>`).join('')}search.oninput=render;render();
</script></body></html>
